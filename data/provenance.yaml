# Where this data comes from and what was done to it.

source:
  name: OurAirports
  maintainer: David Megginson and the OurAirports contributors
  about: https://ourairports.com/about.html
  data_page: https://ourairports.com/data/
  repository: https://github.com/davidmegginson/ourairports-data
  commit: 9e51f13487de777bdc473a37d271981a2d0b30ca
  committed: 2026-08-31T01:53:13Z
  fetched: 2026-10-02
  licence:
    applied: public domain
    basis: |
      The download page says "All data is released to the Public Domain, and
      comes with no guarantee of accuracy or fitness for use." The
      repository's LICENSE is The Unlicense and speaks only of software; the
      statement for the data is the site's.
    attribution_required: false
    attribution_requested: true
    share_alike: false

snapshot:
  note: |
    OurAirports rebuilds all seven files every night at the same URLs, and no
    row carries the date it last changed. A version can only be named by the
    commit that holds it. This one is the last commit of August 2026, so the
    month in the name is the month the data is from.

    The files do not all change every night. Between snapshots airports.csv
    and runways.csv move almost daily; countries.csv had not changed since
    2025-02-28 and navaids.csv rarely does. The HTTP Last-Modified of the
    GitHub Pages copies is the time the pages were rebuilt, not the time a
    file's content changed.
  checksums: csv/MANIFEST.sha256
  verified_against: the git blob of each file in the commit's tree

